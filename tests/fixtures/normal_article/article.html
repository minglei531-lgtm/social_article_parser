  <div id="js_content">
    <p>下雨的早晨，巷子里的石板路像一张慢慢展开的信纸。人们撑着伞经过，鞋跟敲出短促却不慌张的节拍。</p>
    <h2>清晨的街道</h2>
    <p>我沿着河边步行，看到卖花人把一束束白色雏菊摆在塑料布上。雨水让颜色变得更深，也让每一次停留都显得具体。</p>
    <img data-src="https://example.test/rain.jpg" alt="雨后街景">
    <p>城市不是由地标组成的，而是由这些无人统计的细节组成：一扇迟迟没有打开的窗，一辆缓慢驶过的自行车，以及站在屋檐下等雨停的人。</p>
    <ul><li>第一条观察</li><li>第二条观察</li></ul>
    <blockquote>城市并不急着回答问题。</blockquote>
    <p>当中午的光线穿透云层，我才明白阅读一座城需要的不只是路线，还需要愿意把速度放慢一点的耐心。</p>
  </div>
