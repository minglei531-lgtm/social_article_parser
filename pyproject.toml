[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-article-parser"
version = "0.1.0"
description = "Local social-media article HTML to clean Markdown/TXT parser"
requires-python = ">=3.11"

[project.scripts]
social-parse = "social_article_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
